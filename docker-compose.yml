services:
  flight-search-be:
    container_name: flight-search-be-app
    build: ./breakable-toy-backend
    restart: on-failure:5
    ports:
      - "8080:8080"
    networks:
      - flight-search-network

  
  flight-search-fe:
    container_name: flight-search-fe-app
    build: ./breakable-toy-frontend
    restart: on-failure:5
    depends_on:
      - flight-search-be
    ports:
      - "5173:5173"
    networks:
      - flight-search-network

networks:
  flight-search-network:
    name: "FlightSearchNetwork"